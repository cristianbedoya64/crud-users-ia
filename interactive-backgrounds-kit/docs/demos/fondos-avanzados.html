<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fondos interactivos avanzados</title>
<style>
:root{--bg:#f6f7fb;--fg:#14172b;--dot:#4f5ef0;--card:rgba(255,255,255,.82);--bd:rgba(20,23,43,.15);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d1a;--fg:#eef0ff;--dot:#8a96ff;--card:rgba(20,23,43,.78);--bd:rgba(238,240,255,.18);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d1a;--fg:#eef0ff;--dot:#8a96ff;--card:rgba(20,23,43,.78);--bd:rgba(238,240,255,.18);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
h1{font-size:clamp(1.6rem,5vw,3rem);margin:0 0 .4rem}
#d{margin:0 0 1.2rem;max-width:34rem;opacity:.85;line-height:1.5;min-height:3em}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto;background:var(--card);border:1px solid var(--bd);padding:6px;border-radius:20px;backdrop-filter:blur(8px)}
button{font:inherit;font-size:.9rem;color:var(--fg);background:transparent;border:0;padding:8px 14px;border-radius:999px;cursor:pointer}
button[aria-pressed="true"]{background:var(--dot);color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
  <h1>Fondos interactivos avanzados</h1>
  <p id="d"></p>
  <div class="tabs" id="tabs"></div>
</main>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr,cur='flow',mouse={x:-999,y:-999,in:false},clicks=[],S={};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const E={
flow:{name:'Flow field',desc:'Campo de flujo: miles de partículas siguen un campo de ruido y dejan estelas. El cursor crea un remolino.',
 init(){S.p=Array.from({length:Math.min(800,W*H/2200|0)},()=>{const x=Math.random()*W,y=Math.random()*H;return{x,y,px:x,py:y}})},
 trail:true,
 draw(t,c){
  ctx.globalAlpha=.07;ctx.fillStyle=c.bg;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.8;ctx.strokeStyle=c.dot;ctx.lineWidth=1;ctx.beginPath();
  for(const p of S.p){
   p.px=p.x;p.py=p.y;
   let a=Math.sin(p.x*.004+t*.0003)*Math.cos(p.y*.004-t*.00025)*6.283;
   const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);
   if(mouse.in&&d<220){const k=1-d/220;a=a*(1-k)+(Math.atan2(dy,dx)+1.57)*k}
   p.x+=Math.cos(a)*1.5;p.y+=Math.sin(a)*1.5;
   if(p.x<0||p.x>W||p.y<0||p.y>H||Math.random()<.002){p.x=Math.random()*W;p.y=Math.random()*H;p.px=p.x;p.py=p.y}
   ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();ctx.globalAlpha=1;
 }},
ripple:{name:'Ripples',desc:'Ondas: la malla de puntos pulsa en ondas desde el cursor, y cada clic lanza un anillo expansivo.',
 init(){},
 draw(t,c){
  ctx.fillStyle=c.dot;const g=24;
  for(let x=g/2;x<W;x+=g)for(let y=g/2;y<H;y+=g){
   let s=1.2,a=.22;
   if(mouse.in){const d=Math.hypot(x-mouse.x,y-mouse.y),w=Math.max(0,Math.sin(d*.05-t*.006))*Math.exp(-d/220);s+=w*3;a+=w*.7}
   for(const k of clicks){const d=Math.hypot(x-k.x,y-k.y),r=(t-k.t)*.35,e=Math.exp(-Math.abs(d-r)/30)*Math.max(0,1-(t-k.t)/1800);s+=e*4;a+=e*.8}
   ctx.globalAlpha=Math.min(a,1);ctx.beginPath();ctx.arc(x,y,s,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;clicks=clicks.filter(k=>t-k.t<1800);
 }},
aurora:{name:'Aurora / Mesh gradient',desc:'Degradado de malla animado: manchas de luz que flotan y una de ellas sigue suavemente al cursor.',
 init(){S.mx=W/2;S.my=H/2},
 draw(t,c){
  ctx.clearRect(0,0,W,H);
  const tx=mouse.in?mouse.x:W/2,ty=mouse.in?mouse.y:H/2;S.mx+=(tx-S.mx)*.05;S.my+=(ty-S.my)*.05;
  const r=Math.max(W,H)*.35;
  for(let i=0;i<5;i++){
   const x=i===0?S.mx:W*(.5+.38*Math.sin(t*.0003*(i+1)+i*2)),y=i===0?S.my:H*(.5+.35*Math.cos(t*.00025*(i+2)+i)),hue=215+i*32;
   const g=ctx.createRadialGradient(x,y,0,x,y,r);
   g.addColorStop(0,'hsla('+hue+',90%,60%,.38)');g.addColorStop(1,'hsla('+hue+',90%,60%,0)');
   ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
 }},
flicker:{name:'Flickering grid',desc:'Cuadrícula parpadeante estilo matrix: cada celda titila al azar y el cursor actúa como foco de luz.',
 init(){S.cells=[];for(let x=8;x<W;x+=16)for(let y=8;y<H;y+=16)S.cells.push({x,y,p:Math.random()*6.28,f:.5+Math.random()*2})},
 draw(t,c){
  ctx.fillStyle=c.dot;
  for(const k of S.cells){
   let a=.1+.08*Math.sin(t*.001*k.f+k.p);
   if(mouse.in){const d=Math.hypot(k.x-mouse.x,k.y-mouse.y);if(d<170)a+=(1-d/170)*.85}
   ctx.globalAlpha=Math.min(a,1);ctx.fillRect(k.x-4,k.y-4,8,8);
  }
  ctx.globalAlpha=1;
 }},
magnet:{name:'Magnetic field',desc:'Campo magnético: cientos de “limaduras de hierro” se orientan hacia el cursor como si fuera un imán.',
 init(){},
 draw(t,c){
  const m=mouse.in?mouse:{x:W/2+Math.cos(t*.0006)*W*.3,y:H/2+Math.sin(t*.0008)*H*.25};
  ctx.strokeStyle=c.dot;ctx.lineWidth=1.6;ctx.lineCap='round';const g=26;
  for(let x=g/2;x<W;x+=g)for(let y=g/2;y<H;y+=g){
   const dx=m.x-x,dy=m.y-y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx),k=Math.max(0,1-d/320),L=(10+k*9)/2,ca=Math.cos(a)*L,sa=Math.sin(a)*L;
   ctx.globalAlpha=.2+k*.7;ctx.beginPath();ctx.moveTo(x-ca,y-sa);ctx.lineTo(x+ca,y+sa);ctx.stroke();
  }
  ctx.globalAlpha=1;
 }}
};
function init(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  E[cur].init();ctx.clearRect(0,0,W,H);
}
function loop(t){
  const e=E[cur];
  if(!e.trail)ctx.clearRect(0,0,W,H);
  e.draw(t,{bg:css('--bg'),dot:css('--dot')});
  requestAnimationFrame(loop);
}
const tabs=document.getElementById('tabs'),d=document.getElementById('d');
function set(k){
  cur=k;clicks=[];
  for(const b of tabs.children)b.setAttribute('aria-pressed',b.dataset.k===k);
  d.textContent=E[k].desc;init();
}
for(const k in E){const b=document.createElement('button');b.textContent=E[k].name;b.dataset.k=k;b.onclick=()=>set(k);tabs.appendChild(b)}
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true});
document.addEventListener('pointerleave',()=>{mouse.in=false});
addEventListener('pointerdown',e=>{clicks.push({x:e.clientX,y:e.clientY,t:performance.now()})});
addEventListener('resize',init);
set('flow');requestAnimationFrame(loop);
</script>
</body>
</html>

version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=NoHayMas
      - DB_NAME=uarp_ai
      - NODE_ENV=production
      - CORS_ALLOW_ALL=false
      - CORS_ORIGINS=${CORS_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - SKIP_AUTH=false
    depends_on:
      - postgres
      - ia-panel
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
  ia-panel:
    build: ./ia
    # No exponer puerto IA por defecto; consumo vía backend (red interna)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: uarp_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NoHayMas
    # ports:
    #   - "5432:5432"  # Solo exponer en desarrollo local si es necesario
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
